custom:
  day_plans:
    weekend:
      periods:
      - deep_quiet
      - weekend_morning
      - evening_summary
    workday:
      periods:
      - deep_quiet
      - weekday_morning
      - evening_summary
  default:
    ai_mode: current
    analyze: false
    collect: true
    once:
      analyze: true
      push: true
    push: false
    report_mode: current
  description: 完全自由定义时间段、日计划和周映射。
  name: 自定义
  overlap:
    policy: error_on_overlap
  periods:
    deep_quiet:
      analyze: true
      collect: true
      end: 06:00
      name: 深夜静默
      push: false
      start: '23:00'
    evening_summary:
      ai_mode: daily
      analyze: true
      end: '21:00'
      name: 晚间汇总
      push: true
      report_mode: daily
      start: '19:00'
    weekday_morning:
      end: '10:00'
      name: 工作日早间
      push: true
      report_mode: incremental
      start: 08:00
    weekend_morning:
      end: '12:00'
      name: 周末早间
      push: true
      report_mode: daily
      start: '10:00'
  week_map:
    1: workday
    2: workday
    3: workday
    4: workday
    5: workday
    6: weekend
    7: weekend
presets:
  always_on:
    day_plans:
      all_day:
        periods: []
    default:
      ai_mode: current
      analyze: false
      collect: true
      once:
        analyze: false
        push: false
      push: true
      report_mode: incremental
    description: 全天候监控，有新增立即推送。适合重度用户。
    name: 全天监控
    periods: {}
    week_map:
      1: all_day
      2: all_day
      3: all_day
      4: all_day
      5: all_day
      6: all_day
      7: all_day
  channel_digest:
    day_plans:
      all_day:
        periods:
        - morning_briefing
        - noon_update
        - evening_summary
    default:
      ai_mode: current
      analyze: false
      collect: true
      once:
        analyze: true
        push: true
      push: false
      report_mode: current
    description: 早间速报 + 午间增量 + 晚间全景。适合 Telegram 频道分发。
    name: 频道三段式
    periods:
      morning_briefing:
        ai_mode: current
        analyze: true
        end: 09:30
        name: 早间速报
        push: true
        report_mode: current
        start: 08:00
      noon_update:
        end: '14:00'
        name: 午间增量
        push: true
        report_mode: incremental
        start: '12:30'
      evening_summary:
        ai_mode: daily
        analyze: true
        end: '22:00'
        name: 晚间全景
        push: true
        report_mode: daily
        start: '20:00'
    week_map:
      1: all_day
      2: all_day
      3: all_day
      4: all_day
      5: all_day
      6: all_day
      7: all_day
  morning_evening:
    day_plans:
      all_day:
        periods:
        - evening_summary
    default:
      ai_mode: current
      analyze: true
      collect: true
      once:
        analyze: false
        push: false
      push: true
      report_mode: current
    description: 全天推送 + 晚间当日汇总。适合大多数人。
    name: 早晚汇总
    periods:
      evening_summary:
        ai_mode: daily
        analyze: true
        end: '22:00'
        name: 晚间汇总
        once:
          analyze: true
          push: true
        report_mode: daily
        start: '20:00'
    week_map:
      1: all_day
      2: all_day
      3: all_day
      4: all_day
      5: all_day
      6: all_day
      7: all_day
  night_owl:
    day_plans:
      all_day:
        periods:
        - afternoon_peek
        - late_night
    default:
      ai_mode: current
      analyze: false
      collect: true
      once:
        analyze: true
        push: true
      push: false
      report_mode: current
    description: 午后速览 + 深夜全天汇总。适合夜间工作者、海外时差用户。
    name: 夜猫子模式
    periods:
      afternoon_peek:
        ai_mode: current
        analyze: true
        end: '17:00'
        name: 午后速览
        push: true
        report_mode: current
        start: '15:00'
      late_night:
        ai_mode: daily
        analyze: true
        end: 01:00
        name: 深夜汇总
        push: true
        report_mode: daily
        start: '22:00'
    week_map:
      1: all_day
      2: all_day
      3: all_day
      4: all_day
      5: all_day
      6: all_day
      7: all_day
  office_hours:
    day_plans:
      weekend:
        periods:
        - weekend_free
      workday:
        periods:
        - morning_briefing
        - noon_update
        - closing_summary
    default:
      ai_mode: current
      analyze: false
      collect: true
      once:
        analyze: true
        push: true
      push: false
      report_mode: current
    description: 工作日三段式推送（到岗→午间→收工），周末增量自由推送。
    name: 办公时间
    periods:
      closing_summary:
        ai_mode: daily
        analyze: true
        end: '19:00'
        name: 收工汇总
        push: true
        report_mode: daily
        start: '17:00'
      morning_briefing:
        ai_mode: current
        analyze: true
        end: '11:00'
        name: 到岗速览
        push: true
        report_mode: current
        start: 09:00
      noon_update:
        end: '15:00'
        name: 午间热点
        push: true
        report_mode: current
        start: '13:00'
      weekend_free:
        ai_mode: current
        end: '23:00'
        name: 周末自由
        once:
          analyze: false
          push: false
        push: true
        report_mode: incremental
        start: 08:00
    week_map:
      1: workday
      2: workday
      3: workday
      4: workday
      5: workday
      6: weekend
      7: weekend
